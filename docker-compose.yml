version: '3.8'

services:
  # TIER 1: The Secure Database Engine
  mongodb-backend:
    image: mongo:4.4.18
    container_name: mongodb-backend
    restart: always
    cpus: 2
    mem_limit: 2g
    volumes:
      - mongo-data:/data/db
      - ./backend/database_backup:/backup:ro
      - ./backend/init-restore.sh:/docker-entrypoint-initdb.d/init-restore.sh:ro
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - db-net

  # TIER 2: Headless Data & GenAI Brain
  bookstore-backend:
    build: ./backend  # Points directly to the backend subfolder Dockerfile
    container_name: bookstore-backend-service
    restart: always
    cpus: 1
    mem_limit: 1g
    environment:
      - MONGO_URI=mongodb://mongodb-backend:27017/bookstore
      # ONLY the backend receives the decoupled Gemini credential!
      - GEMINI_API_KEY
      # Shared with the frontend below — the backend rejects any request missing it
      - INTERNAL_SERVICE_TOKEN
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      # On both: reachable by the frontend, and able to reach Mongo. Mongo has
      # no auth of its own, so only a container on db-net can even address it.
      - frontend-net
      - db-net
    depends_on:
      mongodb-backend:
        condition: service_healthy # Waits for Mongo's ping check, not just container start

  # TIER 3: The Public Presentation Layer
  bookstore-frontend:
    build: ./frontend # Points directly to the frontend subfolder Dockerfile
    container_name: bookstore-frontend-service
    restart: always
    cpus: 1
    mem_limit: 512m
    ports:
      - "5001:5001"
    environment:
      - CATALOG_API_URL=http://bookstore-backend:8000
      # No defaults — the app refuses to start if these aren't set on the host
      - SECRET_KEY
      - ADMIN_PASSWORD
      - INTERNAL_SERVICE_TOKEN
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/login', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      # Not on db-net — the frontend has no route to Mongo at all, even though
      # Mongo itself has no username/password to stop it.
      - frontend-net
    depends_on:
      bookstore-backend:
        condition: service_healthy

networks:
  frontend-net:
    driver: bridge
  db-net:
    driver: bridge

volumes:
  mongo-data: