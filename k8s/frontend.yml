apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: tonystark0542/bookstore-frontend:v1
        ports:
        - containerPort: 5001
        env:
        - name: CATALOG_API_URL
          valueFrom:
            configMapKeyRef:
              name: cm-app
              key: CATALOG_API_URL
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: secret-app
              key: SECRET_KEY
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: secret-app
              key: ADMIN_PASSWORD
        - name: INTERNAL_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: secret-app
              key: INTERNAL_SERVICE_TOKEN
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        readinessProbe:
          httpGet:
            path: /login
            port: 5001
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /login
            port: 5001
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: NodePort
  selector:
    app: frontend
  ports:  
    - protocol: TCP
      port: 80
      targetPort: 5001
      nodePort: 30005