apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: tonystark0542/bookstore-frontend:v1
        ports:
        - containerPort: 5001
        env:
        - name: BACKEND_URL
          value: "http://backend-service:8000"
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: NodePort
  selector:
    app: frontend
  ports:  
    - protocol: TCP
      port: 80
      targetPort: 5001
      nodePort: 30005