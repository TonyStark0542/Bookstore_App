apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: tonystark0542/bookstore-backend:v1
        ports:
        - containerPort: 8000
        resources: 
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: MONGO_URI
          valueFrom:
            configMapKeyRef:
              name: cm-app
              key: MONGO_URI
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: secret-app
              key: GEMINI_API_KEY
        - name: INTERNAL_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: secret-app
              key: INTERNAL_SERVICE_TOKEN

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - protocol: TCP 
      port: 8000
      targetPort: 8000